# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx oxlint --quiet {staged_files}
    format:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css,md}"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit

pre-push:
  parallel: false
  commands:
    actionlint:
      run: actionlint
    lint:
      run: npm run lint
    typecheck:
      run: npx tsc --noEmit
    build:
      run: npm run build
